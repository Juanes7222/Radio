<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="color-scheme" content="dark" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- SEO: home values below are the fallback for `vite dev` and for any
         path that is not a public route. The build rewrites this whole block
         per route in vite.config.ts (writeBundle), so each URL in dist ships
         its own title, description, canonical and social tags. -->
    <!--seo:head--><title>La Voz de la Verdad | Radio Cristiana Online 24/7</title>
    <meta name="description" content="Emisora cristiana online transmitiendo 24/7 desde Colombia. Escucha música de alabanza, adoración y mensajes bíblicos que edifican tu fe. Únete a nuestros cultos en vivo." />
    <meta name="author" content="La Voz de la Verdad" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://lavozverdad.com/" />
    <!--/seo:head-->
    
    <!-- Open Graph / Twitter -->
    <!--seo:social--><meta property="og:site_name" content="La Voz de la Verdad" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lavozverdad.com/" />
    <meta property="og:title" content="La Voz de la Verdad | Radio Cristiana Online" />
    <meta property="og:description" content="Emisora cristiana online transmitiendo 24/7 desde Colombia. Escucha música de alabanza, adoración y mensajes bíblicos que edifican tu fe." />
    <meta property="og:image" content="https://lavozverdad.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://lavozverdad.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La Voz de la Verdad" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="La Voz de la Verdad | Radio Cristiana Online" />
    <meta name="twitter:description" content="Emisora cristiana online transmitiendo 24/7 desde Colombia. Escucha música de alabanza, adoración y mensajes bíblicos que edifican tu fe." />
    <meta name="twitter:image" content="https://lavozverdad.com/og-image.png" />
    <meta name="twitter:image:alt" content="La Voz de la Verdad" />
    <!--/seo:social-->
    
    <!-- Structured data -->
    <script type="application/ld+json"><!--seo:jsonld-->{}<!--/seo:jsonld--></script>
    
    <!-- iOS / Apple Touch Icon (single 180px: iOS scales down) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Voz de la Verdad" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png" />

    <!-- Windows / Microsoft -->
    <meta name="msapplication-TileColor" content="#0A0E1A" />
    <meta name="msapplication-TileImage" content="/ms-icon-150x150.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
