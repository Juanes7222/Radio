# =============================================================================
# domains/vozyverdad.com.conf — public site + admin panel
#
# Same structure as lavozverdad.com; only domain, certificates and CSP differ.
# The panel declares its own full header set (stricter than the web one), so
# it does not use the shared security-headers snippet: nginx merges
# add_header at the same level, and including both would emit duplicate
# HSTS/X-Frame-Options headers.
# =============================================================================

# ---- Public web --------------------------------------------------------------
server {
    listen      80;
    server_name vozyverdad.com www.vozyverdad.com;
    return      301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name vozyverdad.com www.vozyverdad.com;

    ssl_certificate     /etc/letsencrypt/live/vozyverdad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozyverdad.com/privkey.pem;
    include radio/snippets/ssl.conf;

    root  /var/www/radio/apps/web/dist;
    index index.html;

    include radio/snippets/security-headers.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-//G19Hq3BLQ3HQyyyR3t+wwG1va20PazY8GHIAHR+gI=' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com; img-src 'self' data: https: blob:; font-src 'self'; media-src 'self' https: blob: data:; connect-src 'self' https://vozyverdad.com https://www.vozyverdad.com wss://vozyverdad.com wss://www.vozyverdad.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://www.googleapis.com https://apis.google.com https://accounts.google.com; frame-src https://www.facebook.com https://accounts.google.com https://www.gstatic.com https://iglesia-descarga.firebaseapp.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    include radio/snippets/block-scanners.conf;
    include radio/snippets/web-locations.conf;
}

# ---- Admin panel --------------------------------------------------------------
server {
    listen      80;
    server_name panel.vozyverdad.com;
    return      301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name panel.vozyverdad.com;

    ssl_certificate     /etc/letsencrypt/live/vozyverdad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozyverdad.com/privkey.pem;
    include radio/snippets/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header Referrer-Policy           "no-referrer"                        always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header X-Robots-Tag              "noindex, nofollow"                  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://panel.vozyverdad.com; frame-ancestors 'none'; form-action 'self';" always;

    client_max_body_size 512M;

    auth_basic           "Restricted access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include radio/snippets/panel-locations.conf;
}
