packages:
  - apps/*
  - backend
  - packages/*
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
onlyBuiltDependencies:
  - '@firebase/util'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - better-sqlite3
  - esbuild
  - prisma
  - protobufjs
overrides:
  '@grpc/grpc-js': ^1.14.5
  browserslist: ^4.28.8
  expo: ~57.0.18
  expo-router: ~57.0.17
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-worklets: 0.10.1
  # GHSA-27r3-jxmh-p828: trailing bytes after a compressed body (DoS).
  # Patched in body-parser 1.20.9 (1.x) and 2.4.0 (2.x).
  body-parser@1: ^1.20.9
  brace-expansion@<2: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@>=3: 5.0.12
  esbuild: 0.28.1
  fast-uri@3: 3.1.5
  form-data@4: ^4.0.6
  js-yaml@<4: 3.15.1
  js-yaml@4: 4.3.2
  '@xmldom/xmldom@0.8': 0.8.15
  '@xmldom/xmldom@0.9': 0.9.12
  nanoid@<3.3.18: 3.3.18
  postcss@8: ^8.5.29
  proxy-addr: ^2.0.8
  '@fastify/busboy': ^3.2.2
  source-map-js: ^1.2.2
  morgan: ^1.12.1
  qs: ^6.16.0
  shell-quote: ^1.8.5
  tar: ^7.5.21
  undici@6: 6.28.0
  undici@7: 7.29.0
  uuid: ^11.1.1
  # GHSA-587h-7wmj-h5pm: launch-editor fs.existsSync bypass on Windows.
  # Patched in vite 7.3.7 (7.x line); also covers vitest's vite dependency.
  vite@7: ^7.3.7
  # GHSA-mrhx-c7xc-m3w5: memory exhaustion on oversized constrained
  # collections. Patched in zod 4.6.6; 3.x is only used by the Expo CLI.
  zod@4: ^4.6.6
packageExtensions:
  expo-router@57.0.17:
    dependencies:
      nanoid: ^3.3.18
patchedDependencies:
  expo-modules-autolinking@57.0.12: patches/expo-modules-autolinking@57.0.12.patch
