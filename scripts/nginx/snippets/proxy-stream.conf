# =============================================================================
# snippets/proxy-stream.conf — unbuffered long-lived streaming proxy
#
# For audio streams and SSE endpoints: no buffering, no caching, and a very
# long read timeout so connections are not cut mid-stream.
# =============================================================================

proxy_buffering    off;
proxy_cache        off;
proxy_read_timeout 3600s;
proxy_http_version 1.1;
