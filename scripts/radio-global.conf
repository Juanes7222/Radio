
limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
limit_req_zone  $binary_remote_addr zone=general:10m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# Explicit bucket size keeps the CORS origins hash table independent of the nginx build default.
map_hash_bucket_size 128;

map $http_origin $cors_origin {
    default "";
    "https://lavozverdad.com"             $http_origin;
    "https://www.lavozverdad.com"         $http_origin;
    "https://vozyverdad.com"              $http_origin;
    "https://www.vozyverdad.com"          $http_origin;
    "~^http://localhost(:\d+)?$"          $http_origin;
    "null"                                "null";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
