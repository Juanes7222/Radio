# =============================================================================
# snippets/upload-tuning.conf — tuning for large upload locations
#
# Disables request buffering so big bodies stream straight to the backend
# instead of spilling to disk on the proxy, and widens the transfer timeouts.
# Intended for locations that set client_max_body_size themselves.
# =============================================================================

proxy_request_buffering off;
proxy_buffering         off;
proxy_read_timeout      600s;
proxy_send_timeout      600s;
proxy_connect_timeout   60s;
