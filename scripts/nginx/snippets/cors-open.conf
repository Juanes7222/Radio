# =============================================================================
# snippets/cors-open.conf — CORS preflight + headers (no credentials)
#
# For endpoints called cross-origin without cookies. Adds the allowlisted
# Origin header and answers OPTIONS preflights locally (204).
# Requires $cors_origin (map in radio-global.conf).
# =============================================================================

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type, authorization, cache-control" always;
    add_header Content-Length               0;
    return 204;
}

add_header Access-Control-Allow-Origin $cors_origin always;
