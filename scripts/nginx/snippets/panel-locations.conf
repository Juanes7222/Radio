# =============================================================================
# radio/snippets/panel-locations.conf — all location blocks served by the admin panel
#
# The panel is a single proxied app on :8080 protected by basic auth, plus the
# live websocket endpoint. Basic auth, body size limit and security headers
# are set by the including server block.
# =============================================================================

location /api/live/ {
    include radio/snippets/proxy-websocket.conf;
    proxy_pass                 http://127.0.0.1:8080/api/live/;
    chunked_transfer_encoding  on;
}

location / {
    # The panel app serves its own CSP; drop ours so only one is sent.
    proxy_hide_header Content-Security-Policy;

    proxy_pass         http://127.0.0.1:8080;
    include radio/snippets/proxy-common.conf;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
