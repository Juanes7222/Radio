# =============================================================================
# radio/snippets/web-locations.conf — all location blocks served by the public web
#
# Must be included inside a server block that defines root/index. Backend
# topology:
#   :8080 — streaming server (audio + live websocket)
#   :3000 — main backend API
#   :3001 — workers websocket
# =============================================================================

# --- Audio stream ------------------------------------------------------------
location /listen/la_voz_de_la_verdad/ {
    include radio/snippets/proxy-stream.conf;
    proxy_pass       http://127.0.0.1:8080/listen/la_voz_de_la_verdad/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_conn       conn_limit 15;
}

# --- Live websocket ------------------------------------------------------------
location /api/live/ {
    include radio/snippets/proxy-websocket.conf;
    proxy_pass                 http://127.0.0.1:8080/api/live/;
    chunked_transfer_encoding  on;
}

# --- Main API (CORS with credentials, tight rate limit) ------------------------
location /api/ {
    include radio/snippets/cors-credentials.conf;
    proxy_pass         http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_cache_bypass $http_upgrade;
    limit_req          zone=api burst=60 nodelay;
}

# --- Station status (CORS, no credentials) --------------------------------------
location /api/station/ {
    include radio/snippets/cors-open.conf;
    proxy_pass       http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

# --- Webhook receiver ------------------------------------------------------------
location /admin-api/youtube/webhook {
    proxy_pass       http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    limit_req        zone=general burst=10 nodelay;
}

# --- Upload endpoints (large bodies, unbuffered) ---------------------------------
location /admin-api/upload {
    client_max_body_size 200M;
    include radio/snippets/upload-tuning.conf;
    proxy_pass       http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

location /admin-api/workers/upload {
    client_max_body_size 100M;
    include radio/snippets/upload-tuning.conf;
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location /admin/worker-releases {
    client_max_body_size 50M;
    proxy_request_buffering off;
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_pass          http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

location /admin-api/notices/images {
    client_max_body_size 25M;
    proxy_request_buffering off;
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_pass          http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

location /admin-api/notices/videos {
    client_max_body_size 130M;
    proxy_request_buffering off;
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_pass          http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

location /admin-api/locutor {
    include radio/snippets/cors-credentials.conf;
    client_max_body_size 50M;
    proxy_pass          http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;
    proxy_buffering     off;
    proxy_cache         off;
}

# --- Workers (websocket on exact match, REST on prefix) ----------------------------
location = /admin-api/workers {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

location /admin-api/workers/ {
    proxy_pass         http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_cache_bypass $http_upgrade;
}

# --- Remaining admin API ------------------------------------------------------------
location /admin-api/ {
    proxy_pass         http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_cache_bypass $http_upgrade;
}

location /workers/ {
    proxy_pass http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

location /admin-api/health {
    proxy_pass         http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_read_timeout 86400;
}

# --- Internal-only (loopback) --------------------------------------------------------
location /internal/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

# --- Panel webhook (secret header passthrough) ----------------------------------------
location /webhook/ {
    # Preflight answered locally with a narrower method/header allowlist than
    # the shared CORS snippets, matching the webhook's POST-only contract.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, x-webhook-secret" always;
        add_header Content-Length               0;
        return 204;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;

    proxy_pass         http://127.0.0.1:3000/webhook/;
    include radio/snippets/proxy-common.conf;
    proxy_set_header   X-Webhook-Secret $http_x_webhook_secret;
    limit_req          zone=general burst=10 nodelay;
}

# --- Panel API (secret header passthrough) ---------------------------------------------
location /panel-api/ {
    include radio/snippets/cors-open.conf;
    proxy_pass       http://127.0.0.1:3000/panel-api/;
    include radio/snippets/proxy-common.conf;
    proxy_set_header x-panel-secret $http_x_panel_secret;
    limit_req        zone=general burst=10 nodelay;
}

# --- Live status SSE --------------------------------------------------------------------
location /live-status/ {
    include radio/snippets/cors-credentials.conf;
    proxy_pass                 http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_buffering            off;
    proxy_cache                off;
    proxy_read_timeout         3600s;
    chunked_transfer_encoding  on;
    limit_conn                 conn_limit 15;
}

# --- Misc backend endpoints ---------------------------------------------------------------
location /health {
    proxy_pass         http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
    proxy_read_timeout 86400;
}

location /docs {
    proxy_pass http://127.0.0.1:3000;
    include radio/snippets/proxy-common.conf;
}

# --- SPA fallback ---------------------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.html;
    limit_req zone=general burst=10 nodelay;
}

include radio/snippets/static-cache.conf;
