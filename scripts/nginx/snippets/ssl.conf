# =============================================================================
# snippets/ssl.conf — TLS parameters shared by every HTTPS server block
#
# Expects the including server block to set ssl_certificate and
# ssl_certificate_key first (they are per-domain).
#
# Uses ssl_prefer_server_ciphers on with a modern ECDHE+AEAD cipher list:
# strong TLSv1.2 suites, with TLSv1.3 suites (not configurable in nginx)
# taking priority for TLSv1.3 clients.
# =============================================================================

ssl_protocols            TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# Session resumption settings are shared; the cache zone is defined in
# radio-global.conf so all sites share the same session cache.
ssl_session_timeout 10m;

# OCSP stapling. The resolver is required only when stapling is enabled,
# so panel sites (which skip stapling) can include this file harmlessly.
ssl_stapling         on;
ssl_stapling_verify  on;
resolver             1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout     5s;
