# =============================================================================
# snippets/security-headers.conf — baseline security headers for HTTPS sites
#
# Content-Security-Policy is intentionally NOT set here: it differs per domain
# and each server block must define it after including this file.
# Note on nginx add_header inheritance: a server-level add_header set replaces
# inherited ones, so this snippet is only safe when the including server block
# adds no other headers of its own except the CSP.
# =============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options           "SAMEORIGIN"                                                   always;
add_header X-Content-Type-Options    "nosniff"                                                      always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"                              always;
add_header X-XSS-Protection          "1; mode=block"                                                always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
