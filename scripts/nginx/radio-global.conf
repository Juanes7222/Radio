
limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
limit_req_zone  $binary_remote_addr zone=general:10m  rate=30r/m;
# Connection caps are keyed by client IP, so a single browser tab spends several
# slots at once: the audio stream plus each SSE plus the polling intervals all
# share one origin. Audio and realtime used to share one zone at 15, which a
# normal listener exhausted on their own — and any listener behind the same
# CGNAT or office NAT spent that same budget together, so nginx answered 503 and
# the player sat in its reconnect loop while the audio kept playing.
#
# The two are budgeted separately on purpose: a listener holding the stream open
# must not evict an unrelated listener's SSE, and vice versa. The caps stay low
# enough to blunt abuse, high enough for several tabs plus a shared NAT.
limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# Explicit bucket size keeps the CORS origins hash table independent of the nginx build default.
map_hash_bucket_size 128;

map $http_origin $cors_origin {
    default "";
    "https://lavozverdad.com"             $http_origin;
    "https://www.lavozverdad.com"         $http_origin;
    "https://vozyverdad.com"              $http_origin;
    "https://www.vozyverdad.com"          $http_origin;
    "~^http://localhost(:\d+)?$"          $http_origin;
    "null"                                "null";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The client-side routes of the public site. A request that matches none of
# them is a 404: serving the home page with a 200 for every typo is a soft
# 404, and it spends crawl budget on URLs nobody asked for.
map $uri $spa_route {
    default                0;
    "~^/$"                 1;
    "~^/admin(/|$)"        1;
    "~^/programacion/?$"   1;
    "~^/opiniones/?$"      1;
    "~^/info/"             1;
    "~^/lectura-de-hoy/?$" 1;
}
