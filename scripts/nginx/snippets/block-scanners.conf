# =============================================================================
# snippets/block-scanners.conf — drop exploit probes and empty-UA clients
#
# return 444 closes the connection without a response, which is the cheapest
# possible handling for scanner noise. Runs before any location matching.
# =============================================================================

if ($http_user_agent = "") {
    return 444;
}

location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|phpmyadmin|xmlrpc\.php|\.env|\.git|setup-config|config\.php|\.htaccess|\.htpasswd) {
    return 444;
}

location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|rb|lua)$ {
    return 444;
}
