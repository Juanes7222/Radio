# =============================================================================
# snippets/proxy-common.conf — standard proxy headers for backend passthrough
#
# Meant to be included inside any location{} that proxies to a backend. It
# keeps keep-alive connections to the backend and forwards the client identity
# headers every service expects.
# =============================================================================

proxy_http_version 1.1;
proxy_set_header   Connection        keep-alive;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
