# =============================================================================
# snippets/static-cache.conf — long-lived caching for hashed static assets
#
# Files matching common asset extensions get a 30-day client cache and skip
# the access log. Placed after location / so exact SPA routes win first.
# =============================================================================

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires    30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
}
