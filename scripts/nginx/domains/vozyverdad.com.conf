# =============================================================================
# domains/vozyverdad.com.conf — redirect-only host
#
# This domain used to serve the full public site from the same dist/ as
# lavozverdad.com, which split search authority across two hosts. It now 301s
# everything to the canonical host and stops including web-locations.conf.
# =============================================================================

server {
    listen      80;
    server_name vozyverdad.com www.vozyverdad.com;
    return      301 https://lavozverdad.com$request_uri;
}

server {
    listen      443 ssl http2;
    server_name vozyverdad.com www.vozyverdad.com;

    ssl_certificate     /etc/letsencrypt/live/vozyverdad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozyverdad.com/privkey.pem;
    include radio/snippets/ssl.conf;

    return 301 https://lavozverdad.com$request_uri;
}

# ---- Admin panel --------------------------------------------------------------
server {
    listen      80;
    server_name panel.vozyverdad.com;
    return      301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name panel.vozyverdad.com;

    ssl_certificate     /etc/letsencrypt/live/vozyverdad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozyverdad.com/privkey.pem;
    include radio/snippets/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header Referrer-Policy           "no-referrer"                        always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header X-Robots-Tag              "noindex, nofollow"                  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://panel.vozyverdad.com; frame-ancestors 'none'; form-action 'self';" always;

    client_max_body_size 512M;

    auth_basic           "Restricted access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include radio/snippets/panel-locations.conf;
}
