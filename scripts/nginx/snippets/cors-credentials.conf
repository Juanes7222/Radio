# =============================================================================
# snippets/cors-credentials.conf — CORS preflight + headers with credentials
#
# For endpoints called cross-origin with cookies/authorization. The backend
# also emits CORS headers, so duplicated upstream headers are hidden before
# adding ours. Requires $cors_origin (map in radio-global.conf).
# =============================================================================

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "content-type, authorization, cache-control" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Length                   0;
    return 204;
}

proxy_hide_header  Access-Control-Allow-Origin;
add_header         Access-Control-Allow-Origin      $cors_origin always;
add_header         Access-Control-Allow-Credentials "true"       always;
